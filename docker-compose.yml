services:
  database:
    image: postgis/postgis:17-3.5
    container_name: mars-pathfinder-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mars_pathfinder
      POSTGRES_USER: mars_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - mars_db_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mars_admin -d mars_pathfinder"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mars-pathfinder-api
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_PORT: 8081
      DATABASE_URL: postgres://mars_admin:${DB_PASSWORD}@database:5432/mars_pathfinder?sslmode=disable
      FRONTEND_ORIGIN: http://localhost:8088
    ports:
      - "8081:8081"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_CESIUM_ION_TOKEN: ${VITE_CESIUM_ION_TOKEN}
        VITE_CESIUM_MARS_ASSET_ID: 3644333
        VITE_MARS_WMTS_CAPABILITIES_URL: ${VITE_MARS_WMTS_CAPABILITIES_URL}
        VITE_MARS_GLOBAL_LAYER_ID: Mars_MGS_MOLA_ClrShade_merge_global_463m
        VITE_MARS_MATRIX_SET: Equirectangular
    container_name: mars-pathfinder-frontend
    restart: unless-stopped
    ports:
      - "8088:80"
    depends_on:
      - backend

volumes:
  mars_db_data:
